{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card login-card">
            <div class="card-body p-5">
                <h1 class="text-center mb-2">
                    Welcome Back
                </h1>
                <p class="text-center text-muted mb-5">
                    Access your HouseHelp account.
                </p>
                {% if error %}
                    <div class="alert alert-danger">
                        {{ error }}
                    </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label class="form-label">
                            
                            Username
                        
                        </label>
                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            required
                        >
                    </div>
                    <div class="mb-4">
                        <label class="form-label">

                            Password

                        </label>
                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            required
                        >
                    </div>
                    <button
                        type="submit"
                        class="btn btn-primary w-100">

                        Login

                    </button>
                </form>
                <hr class="my-4">
                <p class="text-center mb-0">

                    Don't have an account?

                    <a href="/register/"
                       class="fw-bold text-decoration-none">

                        Register

                    </a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
