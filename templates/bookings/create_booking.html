{% extends 'base.html' %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card custom-card shadow-sm">

            <div class="card-body p-4">

                <h2 class="text-center mb-4">
                    Book Service
                </h2>

                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <div class="text-center mt-4">

                        <button
                            type="submit"
                            class="btn btn-primary btn-lg"
                        >
                            Confirm Booking
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
